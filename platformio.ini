; PlatformIO project for Heltec Mesh Node T114
; MCU: nRF52840 | Radio: SX1262 | No GPS | No TFT
;
; The T114 is not in PlatformIO's official board registry, so this project
; ships its own board definition (boards/) and variant files (variants/).
;
; The platform_packages entry swaps in Meshtastic's fork of the Adafruit nRF52
; Arduino BSP. The upstream BSP does not support this board; the fork adds
; C++17 support and the correct SoftDevice/linker configuration.

[platformio]
default_envs = heltec-mesh-node-t114

[env:heltec-mesh-node-t114]
platform = platformio/nordicnrf52@10.11.0
platform_packages =
    platformio/framework-arduinoadafruitnrf52 @ https://github.com/meshtastic/Adafruit_nRF52_Arduino#cpp17-platform
    platformio/toolchain-gccarmnoneeabi@~1.90301.0

framework  = arduino
board      = heltec_mesh_node_t114   ; defined in boards/heltec_mesh_node_t114.json
build_type = release

; Convert the post-build .hex to a .uf2 for drag-and-drop flashing
extra_scripts = extra_scripts/nrf52_uf2.py

build_flags =
    -Ivariants/heltec_mesh_node_t114   ; use our local variant.h before any BSP copy
    -DHELTEC_T114
    -DNRF52840_XXAA
    -std=gnu++17
    -DSERIAL_BUFFER_SIZE=4096
    -D LED_BUILTIN=14                   ; fixes Adafruit InternalFileSystem
    -D NOT_AN_INTERRUPT=-1              ; fixes AdvancedRotaryEncoder

build_unflags =
    -std=c++11
    -std=gnu++11

; Compile src/ and our local variant.cpp
; Paths in build_src_filter are relative to src_dir (src/)
build_src_filter = +<*> +<../variants/heltec_mesh_node_t114>

lib_deps =
    ; SX1262 LoRa driver
    https://github.com/jgromes/RadioLib/archive/refs/tags/7.6.0.zip
    ; Onboard RGB LEDs (2x WS2812B on P0.14)
    https://github.com/adafruit/Adafruit_NeoPixel/archive/refs/tags/1.15.4.zip
    ; adafruit st7735 to get the st7789 driver
    https://github.com/adafruit/Adafruit-ST7735-Library/archive/refs/tags/1.11.0.zip
    ; adafruit gfx to get gfx
    https://github.com/adafruit/Adafruit-GFX-Library/archive/refs/tags/1.12.6.zip
    ; tinyGPS
    https://github.com/mikalhart/TinyGPSPlus/archive/refs/tags/v1.0.3a.zip
    ; Timelib
    https://github.com/PaulStoffregen/Time/archive/refs/tags/v1.6.1.zip
    ; Rotary encoder
    https://github.com/RPaulT/AdvancedRotaryEncoder/archive/refs/tags/1.0.1.zip


upload_protocol = nrfutil
monitor_speed   = 115200
monitor_filters = direct
